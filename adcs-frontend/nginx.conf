limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Authorization codes/state can appear in the browser's SSO redirect URL.
# Keep query strings and Referer values out of access logs.
log_format adcs_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;

    server_name adcs.ptitai.org;

    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log adcs_access;
    add_header Referrer-Policy "strict-origin" always;

    # Giới hạn kích thước tệp tải lên (mặc định của nginx là 1MB)
    client_max_body_size 100M;

    location / {
        try_files $uri /index.html;
    }

    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_conn conn_limit 5;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }
}
